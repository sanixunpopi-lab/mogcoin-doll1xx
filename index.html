<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mog Coin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0a0f; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #app { width: 100%; max-width: 420px; height: 100vh; max-height: 780px; background: radial-gradient(circle at 50% 0%, #1a0a2e 0%, #0a0a0f 70%); display: flex; flex-direction: column; padding: 20px; position: relative; }
        
        .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .balance-box { background: rgba(255,215,0,0.1); border: 2px solid rgba(255,215,0,0.3); border-radius: 20px; padding: 10px 20px; text-align: center; flex: 1; margin-right: 10px; }
        .balance-label { font-size: 12px; color: #FFD700; text-transform: uppercase; letter-spacing: 1px; }
        .balance-value { font-size: 28px; font-weight: 700; color: #FFD700; }
        .energy-box { background: rgba(0,255,136,0.1); border: 2px solid rgba(0,255,136,0.3); border-radius: 20px; padding: 10px 20px; text-align: center; }
        .energy-label { font-size: 12px; color: #00FF88; }
        .energy-value { font-size: 20px; font-weight: 700; color: #00FF88; }
        
        .tap-area { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        #coin { width: 200px; height: 200px; border-radius: 50%; background: linear-gradient(135deg, #FFD700, #FFA500); display: flex; justify-content: center; align-items: center; font-size: 80px; cursor: pointer; transition: transform 0.1s; box-shadow: 0 0 60px rgba(255,215,0,0.5), 0 0 120px rgba(255,215,0,0.2); position: relative; }
        #coin:active { transform: scale(0.9); }
        #coin::before { content: ''; position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 4px solid rgba(255,255,255,0.2); }
        
        .tap-effect { position: absolute; font-size: 24px; font-weight: 700; color: #FFD700; pointer-events: none; animation: floatUp 0.8s ease-out forwards; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100px); } }
        
        .bottom { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 16px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: linear-gradient(135deg, #7B2FBE, #A855F7); color: #fff; }
        .btn-secondary { background: #1a1a2e; color: #8A8A9A; border: 1px solid #2a2a3e; }
    </style>
</head>
<body>
    <div id="app">
        <div class="top">
            <div class="balance-box">
                <div class="balance-label">Mog Coin</div>
                <div class="balance-value" id="balance">0</div>
            </div>
            <div class="energy-box">
                <div class="energy-label">⚡ Энергия</div>
                <div class="energy-value"><span id="energy">1000</span></div>
            </div>
        </div>
        
        <div class="tap-area" id="tapArea">
            <div id="coin">🐸</div>
        </div>
        
        <div class="bottom">
            <button class="btn btn-primary" onclick="claimBonus()">🎁 Бонус</button>
            <button class="btn btn-secondary" onclick="openRef()">👥 Друзья</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        let user = tg.initDataUnsafe?.user || { id: 123456, first_name: 'Player' };
        let balance = 0;
        let energy = 1000;
        const MAX_ENERGY = 1000;
        const ENERGY_PER_TAP = 1;
        const COINS_PER_TAP = 1;
        const ENERGY_REGEN = 2; // в секунду
        
        const coin = document.getElementById('coin');
        const balanceEl = document.getElementById('balance');
        const energyEl = document.getElementById('energy');
        const tapArea = document.getElementById('tapArea');
        
        // Загружаем баланс с сервера (если есть)
        async function loadBalance() {
            try {
                const resp = await fetch(`https://mog-coin-bot.onrender.com/balance/${user.id}`);
                const data = await resp.json();
                if (data.balance !== undefined) {
                    balance = data.balance;
                    balanceEl.textContent = balance;
                }
            } catch(e) { console.log('Сервер недоступен'); }
        }
        
        // Тап
        coin.addEventListener('click', (e) => {
            if (energy < ENERGY_PER_TAP) return;
            
            energy -= ENERGY_PER_TAP;
            balance += COINS_PER_TAP;
            
            balanceEl.textContent = balance;
            energyEl.textContent = energy;
            
            // Эффект
            const effect = document.createElement('div');
            effect.className = 'tap-effect';
            effect.textContent = '+' + COINS_PER_TAP;
            effect.style.left = (e.clientX - 20) + 'px';
            effect.style.top = (e.clientY - 20) + 'px';
            effect.style.position = 'fixed';
            document.body.appendChild(effect);
            setTimeout(() => effect.remove(), 800);
            
            // Вибрация
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            
            // Сохраняем на сервер (раз в 10 тапов)
            if (balance % 10 === 0) saveBalance();
        });
        
        // Восстановление энергии
        setInterval(() => {
            if (energy < MAX_ENERGY) {
                energy = Math.min(MAX_ENERGY, energy + ENERGY_REGEN);
                energyEl.textContent = energy;
            }
        }, 1000);
        
        // Сохранение на сервер
        async function saveBalance() {
            try {
                await fetch(`https://mog-coin-bot.onrender.com/balance/${user.id}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ balance: balance })
                });
            } catch(e) {}
        }
        
        function claimBonus() {
            if (balance >= 100) {
                balance += 50;
                balanceEl.textContent = balance;
                tg.HapticFeedback?.notificationOccurred('success');
                alert('🎁 +50 Mog Coin!');
            } else {
                alert('❌ Нужно минимум 100 Mog Coin для бонуса');
            }
        }
        
        function openRef() {
            const link = `https://t.me/mogcoin_bot?start=ref_${user.id}`;
            tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=Играй в Mog Coin!`);
        }
        
        // Сохраняем при закрытии
        window.addEventListener('beforeunload', saveBalance);
        
        loadBalance();
    </script>
</body>
</html>
